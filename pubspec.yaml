name: irl_streamer
description: App otimizado para lives IRL via RTMP/SRT com overlays interativos e prioridade de estabilidade de conexão.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Streaming real (RootEncoder Android + HaishinKit iOS)
  rtmp_streaming: ^2.1.1

  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  webview_flutter: ^4.8.0
  cached_network_image: ^3.4.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  battery_plus: ^6.0.3
  device_info_plus: ^10.1.2
  wakelock_plus: ^1.2.8
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/overlays/
